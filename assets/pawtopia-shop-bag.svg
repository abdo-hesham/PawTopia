<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" fill="none">
  <defs>
    <linearGradient id="bagGrad" x1="515" y1="360" x2="1000" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="0.58" stop-color="#FFF8E9"/>
      <stop offset="1" stop-color="#F8EFD9"/>
    </linearGradient>
    <linearGradient id="sideGrad" x1="388" y1="420" x2="490" y2="910" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#F1E3C5"/>
    </linearGradient>
    <linearGradient id="bowlGrad" x1="258" y1="830" x2="337" y2="955" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#F4E7CB"/>
    </linearGradient>
    <radialGradient id="ballGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1173 832) rotate(52) scale(126 117)">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="0.74" stop-color="#FFF9EC"/>
      <stop offset="1" stop-color="#EEDDBB"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="135" y1="540" x2="300" y2="827" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E7E5B9"/>
      <stop offset="1" stop-color="#B9C58E"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <style>
      .ink{stroke:#07366D;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke-width:9}
      .med{stroke-width:11}
      .bold{stroke-width:14}
    </style>
  </defs>

  <!-- subtle grounding shadows -->
